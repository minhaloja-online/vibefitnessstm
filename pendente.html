<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento em processamento — Vibe Fitness STM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap');
  :root {
    --ink:#141b2e;
    --bg:#f6f4ee;
    --card:#ffffff;
    --muted:#6b7280;
    --border:#e7e2d6;
    --status:#ffb020;
    --status-soft:#fff3dc;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink);
         margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { position:relative; background:var(--card); border:1px solid var(--border); border-radius:20px;
          box-shadow:0 16px 40px -14px rgba(20,20,10,.16); max-width:420px; width:100%;
          padding:2.6rem 2rem 2.3rem; text-align:center; overflow:hidden; }
  .corner { position:absolute; top:0; right:0; width:0; height:0;
            border-style:solid; border-width:0 90px 90px 0;
            border-color:transparent var(--status) transparent transparent; opacity:.16; }
  .wordmark { position:relative; z-index:1; font-family:'Barlow Condensed',sans-serif; font-weight:800;
              font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
              margin-bottom:1.5rem; }
  .badge { position:relative; z-index:1; width:60px; height:60px; margin:0 auto 1.1rem; border-radius:50%;
           background:var(--status-soft); display:flex; align-items:center; justify-content:center; font-size:1.7rem; }
  h1 { position:relative; z-index:1; font-family:'Barlow Condensed',sans-serif; font-weight:800;
       text-transform:uppercase; letter-spacing:.01em; font-size:1.4rem; margin:0 0 10px; color:var(--ink); }
  p { position:relative; z-index:1; color:var(--muted); font-size:.94rem; line-height:1.65; margin:0; }
  a.btn { position:relative; z-index:1; display:inline-block; margin-top:1.7rem; text-decoration:none;
          font-family:'Barlow Condensed',sans-serif; font-weight:800; text-transform:uppercase;
          letter-spacing:.05em; font-size:.82rem; padding:13px 28px; border-radius:999px;
          background:var(--ink); color:#fff; }
  a.btn:hover { filter:brightness(1.15); }
  a.btn:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  @media (prefers-reduced-motion:no-preference) {
    .badge { animation:pulso 2.6s ease-in-out infinite; }
  }
  @keyframes pulso { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.07); } }
</style>
</head>
<body>
  <div class="card">
    <div class="corner" aria-hidden="true"></div>
    <div class="wordmark">Vibe Fitness STM</div>
    <div class="badge">⏳</div>
    <h1>Pagamento em processamento</h1>
    <p>Pix costuma cair em minutos; boleto leva até 3 dias úteis. Assim que for confirmado, colocamos seu pedido na fila de envio.</p>
    <a class="btn" href="/">Voltar à loja</a>
  </div>
</body>
</html>
